<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>960 километров</title>

    <link
        rel="stylesheet"
        href="page2.css"
    >

</head>


<body>


    <!-- Фоновая сакура -->

    <div class="sakura-background"></div>


    <main class="page">


        <section class="content">


            <!-- Верхний текст -->

            <p class="small-text">
                Есть одна маленькая проблема
            </p>


            <!-- Главный текст -->

            <h1>
                Между нами есть<br>
                расстояние.
            </h1>


            <!-- Маршрут -->

            <div class="route-container">


                <!-- Пиксельная декоративная пушка -->

                <div class="pixel-gun">

                    <div class="gun-body"></div>

                    <div class="gun-barrel"></div>

                    <div class="gun-handle"></div>

                    <div class="gun-sight"></div>

                </div>


                <!-- Эффект выстрела -->

                <div class="shot-flash"></div>


                <!-- Линия маршрута -->

                <div class="route">


                    <!-- Ростов -->

                    <div class="city city-left">

                        <div class="city-dot"></div>

                        <div class="city-name">
                            Ростов
                        </div>

                    </div>


                    <!-- Линия -->

                    <div class="route-line">


                        <div class="distance">
                            ~960 км
                        </div>


                        <!-- Летящая точка -->

                        <div class="bullet"></div>


                    </div>


                    <!-- Москва -->

                    <div class="city city-right">

                        <div class="city-name">
                            Москва
                        </div>

                        <div class="city-dot"></div>

                    </div>


                </div>

            </div>


            <!-- Текст -->

            <p class="description">

                Да, между нами немало километров.

                <br>

                <span>
                    Но расстояние — это всего лишь расстояние.
                </span>

            </p>


            <!-- Переход -->

            <a
                href="#"
                class="next-button"
            >
                дальше
            </a>


        </section>


    </main>


</body>

</html>
