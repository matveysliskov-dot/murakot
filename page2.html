<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Расстояние</title>

    <link rel="stylesheet" href="page2.css">
</head>


<body>

    <!-- Фоновая сакура -->
    <div class="sakura-background"></div>


    <!-- Затемнение -->
    <div class="dark-overlay"></div>


    <main class="page">

        <div class="content">


            <!-- Маленькая надпись -->
            <p class="small-text">
                Но это не так много, как кажется
            </p>


            <!-- Главный текст -->
            <h1>
                Между нами почти<br>
                <span>1000 километров!</span>
            </h1>


            <!-- МАРШРУТ -->
            <section class="route-section">


                <div class="route">


                    <!-- РОСТОВ -->
                    <div class="city city-left">

                        <div class="city-dot"></div>

                        <span>
                            Ростов-на-Дону
                        </span>

                    </div>


                    <!-- ЛИНИЯ -->
                    <div class="route-line">

                        <div class="distance">
                            ~960 км
                        </div>

                    </div>


                    <!-- МОСКВА -->
                    <div class="city city-right">

                    <div class="city-dot"></div>

                        <div class="message-dot"></div>

                    <span>
                        Москва
                    </span>

                    </div>


                </div>

            </section>


            <!-- Текст -->
            <p class="description">

                И всё же расстояние —<br>

                всего лишь несколько цифр.

            </p>


            <!-- Кнопка -->
            <a href="page3.html" class="next-button">
                дальше
            </a>


        </div>

    </main>

</body>

</html>
