<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Расстояние</title>

    <link
        rel="stylesheet"
        href="page2.css"
    >
</head>


<body>

    <!-- Фоновая картинка -->
    <div class="sakura-background"></div>


    <main class="page">

        <div class="content">


            <!-- Верхняя надпись -->
            <p class="small-text">
                Есть одна маленькая проблема
            </p>


            <!-- Заголовок -->
            <h1>
                Между нами<br>
                есть расстояние
            </h1>


            <!-- БЛОК МАРШРУТА -->
            <div class="route-section">


                <!-- ГОРОДА -->
                <div class="route">

                    <!-- РОСТОВ -->
                    <div class="city city-left">

                        <div class="city-dot"></div>

                        <span>
                            Ростов
                        </span>

                    </div>


                    <!-- ЛИНИЯ -->
                    <div class="route-line">

                        <span class="distance">
                            ~960 км
                        </span>


                        <!-- Светящаяся точка -->
                        <div class="message-dot"></div>

                    </div>


                    <!-- МОСКВА -->
                    <div class="city city-right">

                        <span>
                            Москва
                        </span>

                        <div class="city-dot"></div>

                    </div>

                </div>


                <!-- ВИНТОВКА -->
                <div class="gun-area">

                    <div class="pixel-rifle">


                        <!-- ПРИКЛАД -->
                        <div class="stock"></div>


                        <!-- ОСНОВНОЙ КОРПУС -->
                        <div class="body-part"></div>


                        <!-- ВЕРХНЯЯ ЧАСТЬ -->
                        <div class="upper-part"></div>


                        <!-- СТВОЛ -->
                        <div class="barrel"></div>


                        <!-- РУКОЯТКА -->
                        <div class="handle"></div>


                        <!-- МАГАЗИН -->
                        <div class="magazine"></div>


                        <!-- ПРИЦЕЛ -->
                        <div class="scope"></div>


                        <!-- ВСПЫШКА -->
                        <div class="flash"></div>


                    </div>

                </div>


            </div>


            <!-- Нижний текст -->
            <p class="description">

                Да, между нами немало километров.

                <br>

                <span>
                    Но расстояние — это всего лишь расстояние.
                </span>

            </p>


            <!-- Кнопка -->
            <a
                href="#"
                class="next-button"
            >
                дальше
            </a>


        </div>

    </main>

</body>

</html>
