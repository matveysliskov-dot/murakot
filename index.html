<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиксельный тест</title>
    <!-- Подключаем пиксельный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* СБРАСЫВАЕМ ОТСТУПЫ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace; /* ПИКСЕЛЬНЫЙ ШРИФТ */

            /* ПИКСЕЛЬНЫЙ ФОН (паттерн "квадратики") */
            background-color: #1a1a2e;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px; /* размер "пикселя" */
        }

        /* КОНТЕЙНЕР ДЛЯ КАРТИНКИ И ТЕКСТА */
        .container {
            text-align: center;
            padding: 40px;
            border: 4px solid #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
        }

        /* КАРТИНКА */
        .container img {
            display: block;
            margin: 0 auto 30px auto;
            max-width: 300px;
            border: 4px solid #00ffcc;
            image-rendering: pixelated; /* делаем картинку "пиксельной" */
        }

        /* ТЕКСТ ПИКСЕЛЬНЫМ ШРИФТОМ */
        h1 {
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            line-height: 1.6;
        }

        p {
            font-size: 14px;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.8;
        }

        .highlight {
            color: #ff6b6b;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ВСТАВЛЯЕМ КАРТИНКУ "1" -->
        <img src="1.png" alt="Картинка 1">

        <h1>ПИКСЕЛЬНЫЙ ТЕСТ</h1>
        <p>Этот шрифт — <span class="highlight">Press Start 2P</span></p>
        <p style="font-size: 12px; color: #666;">Фон сделан "пиксельным" с помощью CSS</p>
    </div>

</body>
</html>
