<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Для тебя</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="content">

            <p class="eyebrow">
                Сегодня произошло важное событие
            </p>

            <h1>
                У тебя день рождения
            </h1>

            <p class="subtitle">
                И, кажется, обычного сообщения было бы недостаточно.
            </p>


            <div class="distance-card">

                <div class="map-route">

                    <div class="point point-left">
                        <div class="point-dot"></div>
                        <span>Ростов</span>
                    </div>


                    <div class="travel-area">

                        <div class="distance-label">
                            ~960 км
                        </div>

                        <div class="travel-line"></div>

                        <div class="moving-message">
                            <div class="message-lines">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>

                    </div>


                    <div class="point point-right">
                        <span>Москва</span>
                        <div class="point-dot"></div>
                    </div>

                </div>


                <div class="distance-text">

                    <p>
                        Да, между нами немало километров.
                    </p>

                    <p class="important-text">
                        Но, к счастью, сообщения пока не измеряются в расстоянии.
                    </p>

                </div>

            </div>


            <button class="start-button">
                Открыть
            </button>

        </section>

    </main>

</body>
</html>
