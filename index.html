<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Для тебя 🎂</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<main class="page">

    <!-- Фоновое свечение -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>


    <!-- Основной контент -->
    <section class="content">

        <p class="small-title">
            Сегодня произошло важное событие
        </p>

        <h1>
            🎂 У тебя день рождения
        </h1>

        <p class="subtitle">
            И, кажется, обычного сообщения было бы недостаточно.
        </p>


        <!-- Карта расстояния -->
        <div class="distance-card">

            <div class="cities">

                <div class="city">

                    <div class="location-dot"></div>

                    <span class="city-name">
                        Ростов
                    </span>

                </div>


                <div class="distance-line">

                    <div class="line"></div>

                    <span class="distance">
                        ~960 км
                    </span>

                </div>


                <div class="city">

                    <div class="location-dot"></div>

                    <span class="city-name">
                        Москва
                    </span>

                </div>

            </div>


            <p class="distance-text">
                Да, между нами немного километров.
            </p>

            <p class="distance-text second">
                Но, к счастью, сообщения пока не измеряются в расстоянии.
            </p>

        </div>


        <button class="start-button">
            Открыть 👀
        </button>

    </section>

</main>
```

</body>
</html>
