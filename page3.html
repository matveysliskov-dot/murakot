<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Сообщение</title>

    <link rel="stylesheet" href="page3.css">

</head>


<body>


    <!-- Фон -->
    <div class="background"></div>


    <!-- Затемнение -->
    <div class="overlay"></div>


    <main class="page">


        <div class="content">


            <!-- ВЕРХНИЙ ТЕКСТ -->

            <div class="intro">

                <p class="small-text">
                    Но есть одна вещь...
                </p>


                <h1>
                    расстояние не умеет<br>
                    останавливать сообщения.
                </h1>

            </div>


            <!-- КОНВЕРТ -->

            <div
                class="envelope-wrapper"
                id="envelope"
            >


                <!-- Подсказка -->

                <p class="click-text">
                    нажми на конверт
                </p>


                <div class="envelope">


                    <!-- ЗАДНЯЯ ЧАСТЬ -->

                    <div class="envelope-back"></div>


                    <!-- ПИСЬМО -->

                    <div class="letter">


                        <div class="letter-content">


                            <p class="letter-text">

                                Иногда расстояние —
                                это просто цифры.

                            </p>


                            <p class="letter-text second">

                                Потому что если захочется
                                поговорить —

                                <br><br>

                                я всегда где-то
                                на другом конце сообщения.

                            </p>


                            <p class="signature">
                                Из Ростова 🌸
                            </p>


                        </div>

                    </div>


                    <!-- КЛАПАН -->

                    <div class="envelope-flap"></div>


                    <!-- ПЕРЕДНЯЯ ЧАСТЬ -->

                    <div class="envelope-front">

                        <div class="left-fold"></div>

                        <div class="right-fold"></div>

                        <div class="bottom-fold"></div>

                    </div>


                </div>


            </div>


            <!-- КНОПКА ДАЛЬШЕ -->

            <a
                href="#"
                class="next-button"
                id="nextButton"
            >
                дальше
            </a>


        </div>


    </main>


    <script src="page3.js"></script>


</body>

</html>
