<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Письмо</title>

    <link rel="stylesheet" href="page3.css">
</head>

<body>

    <div class="background"></div>

    <main class="page">

        <h1>У меня для тебя кое-что есть</h1>

        <p class="subtitle">
            Нажми на конверт
        </p>


        <div class="envelope-wrapper">

            <div class="envelope" id="envelope">

                <!-- Письмо -->
                <div class="letter">

                    <div class="letter-content">

                        <h2>Привет.</h2>

                        <p>
                            Здесь можешь написать свой текст.
                        </p>

                        <p>
                            Любое поздравление, которое хочешь
                            оставить для неё.
                        </p>

                        <p>
                            А дальше будет ещё кое-что.
                        </p>

                    </div>

                </div>


                <!-- Основа конверта -->
                <div class="envelope-back"></div>

                <!-- Левая часть -->
                <div class="envelope-left"></div>

                <!-- Правая часть -->
                <div class="envelope-right"></div>

                <!-- Крышка -->
                <div class="envelope-flap"></div>

            </div>

        </div>


        <a href="page4.html" class="next-button" id="nextButton">
            Продолжить
        </a>

    </main>


    <script src="page3.js"></script>

</body>
</html>
