<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Алгоритм критического пути</title>

<!-- Подключаем CSS -->
<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="container">

    <h1>Алгоритм критического пути</h1>

    <p class="description">
        Генерация случайной матрицы и сравнение
        случайного, возрастающего и убывающего порядка.
    </p>

    <!-- Блок ввода параметров -->
    <div class="inputs">

        <div>
            <label for="m">M (количество строк):</label>
            <input type="number" id="m" value="4" min="1">
        </div>

        <div>
            <label for="n">N (количество столбцов):</label>
            <input type="number" id="n" value="4" min="1">
        </div>

        <div>
            <label for="t1">t1 (минимальное время):</label>
            <input type="number" id="t1" value="1">
        </div>

        <div>
            <label for="t2">t2 (максимальное время):</label>
            <input type="number" id="t2" value="20">
        </div>

    </div>

    <!-- Кнопка запуска -->
    <button onclick="startProgram()">
        Сгенерировать и сравнить
    </button>


    <!-- Сюда будет выводиться исходная матрица -->
    <div id="original"></div>

    <!-- Сюда будет выводиться матрица по возрастанию -->
    <div id="ascending"></div>

    <!-- Сюда будет выводиться матрица по убыванию -->
    <div id="descending"></div>

    <!-- Сюда будут выводиться результаты -->
    <div id="results"></div>

</div>


<!-- Подключаем JavaScript -->
<script src="script.js"></script>
```

</body>
</html>
