<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">

```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Алгоритм критического пути</title>

<!-- Подключение CSS -->
<link rel="stylesheet" href="lab1.css">
```

</head>

<body>

```
<div class="container">

    <h1>Алгоритм критического пути</h1>

    <p>
        Распределение M заданий между N процессорами
    </p>


    <!-- Ввод данных -->

    <div class="input-block">

        <label>
            M — количество заданий:
        </label>

        <input
            type="number"
            id="m"
            value="14"
            min="1"
        >

    </div>


    <div class="input-block">

        <label>
            N — количество процессоров:
        </label>

        <input
            type="number"
            id="n"
            value="4"
            min="1"
        >

    </div>


    <div class="input-block">

        <label>
            t1 — минимальное время:
        </label>

        <input
            type="number"
            id="t1"
            value="1"
        >

    </div>


    <div class="input-block">

        <label>
            t2 — максимальное время:
        </label>

        <input
            type="number"
            id="t2"
            value="20"
        >

    </div>


    <!-- Кнопка -->

    <button id="startButton">

        Запустить алгоритм

    </button>


    <!-- Исходные задания -->

    <div class="section">

        <h2>Случайно сгенерированные задания</h2>

        <div id="originalTasks"></div>

    </div>


    <!-- Результаты -->

    <div class="section">

        <h2>Сравнение вариантов</h2>

        <div id="results"></div>

    </div>


</div>


<!-- Подключение JavaScript -->

<script src="lab1.js"></script>
```

</body>

</html>
