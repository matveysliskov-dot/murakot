<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MURAKOT — Регистрация</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-container">

        <h1>MURAKOT</h1>

        <p>Создание аккаунта</p>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Имя пользователя"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Пароль"
                minlength="6"
                required
            >

            <button type="submit">
                Зарегистрироваться
            </button>

        </form>

        <p id="message"></p>

        <p>
            Уже есть аккаунт?
            <a href="login.html">Войти</a>
        </p>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Наш Supabase client -->
    <script src="js/supabase.js"></script>

    <!-- Регистрация -->
    <script src="js/auth.js"></script>

</body>
</html>
