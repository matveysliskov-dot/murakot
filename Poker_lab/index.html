<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poker Lab</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Верхнее меню -->
    <header class="header">

        <div class="logo">
            <span>♠</span> POKER LAB
        </div>

        <nav>
            <a href="index.html" class="active">Главная</a>
            <a href="training.html">Тренировка</a>
            <a href="#">Калькулятор</a>
            <a href="#">Статистика</a>
            <a href="#">Обучение</a>
        </nav>

    </header>


    <!-- Главный экран -->
    <main class="home">

        <div class="hero">

            <div class="hero-symbol">♠</div>

            <h1>POKER LAB</h1>

            <p>
                Интерактивный тренажёр
                покерных решений
            </p>

            <div class="buttons">

                <a href="training.html" class="main-button">
                    НАЧАТЬ ТРЕНИРОВКУ
                </a>

                <a href="#" class="secondary-button">
                    КАЛЬКУЛЯТОР
                </a>

            </div>

        </div>


        <!-- Краткая статистика -->

        <section class="quick-stats">

            <div class="stat">
                <span>♣</span>
                <strong>52</strong>
                <small>карты в колоде</small>
            </div>

            <div class="stat">
                <span>♦</span>
                <strong>10</strong>
                <small>уровней комбинаций</small>
            </div>

            <div class="stat">
                <span>♥</span>
                <strong>∞</strong>
                <small>возможностей</small>
            </div>

        </section>

    </main>


    <!-- Подсказка -->

    <div class="fact-box">

        <span class="fact-icon">💡</span>

        <span id="fact">
            Загружаем факт...
        </span>

    </div>


    <script src="js/training.js"></script>

</body>

</html>
