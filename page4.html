<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Три двери</title>

    <link rel="stylesheet" href="page4.css">

</head>


<body>


    <!-- ФОН -->

    <div class="background"></div>

    <div class="overlay"></div>


    <main class="page">


        <!-- ВЕРХНИЙ ТЕКСТ -->

        <section class="intro">

            <p class="small-text">
                Небольшой выбор
            </p>


            <h1>
                А теперь открой<br>
                одну из дверей.
            </h1>


            <p class="subtitle">
                Интересно, что тебя ждёт?
            </p>

        </section>



        <!-- ДВЕРИ -->

        <section class="doors">



            <!-- РОЗОВАЯ ДВЕРЬ -->

            <div
                class="door-card pink-card"
                data-message="Побольше уютных вечеров."
            >


                <div class="door-scene">


                    <div class="door-frame">


                        <div class="door pink-door">


                            <div class="door-panel"></div>


                            <button
                                class="handle"
                                aria-label="Открыть дверь"
                            ></button>


                        </div>


                        <!-- СВЕТ ЗА ДВЕРЬЮ -->

                        <div class="light pink-light"></div>


                    </div>


                </div>


                <p class="door-hint">
                    потяни за ручку
                </p>


            </div>



            <!-- СИНЯЯ ДВЕРЬ -->

            <div
                class="door-card blue-card"
                data-message="Побольше новых впечатлений."
            >


                <div class="door-scene">


                    <div class="door-frame">


                        <div class="door blue-door">


                            <div class="door-panel"></div>


                            <button
                                class="handle"
                                aria-label="Открыть дверь"
                            ></button>


                        </div>


                        <div class="light blue-light"></div>


                    </div>


                </div>


                <p class="door-hint">
                    потяни за ручку
                </p>


            </div>



            <!-- ЗОЛОТАЯ ДВЕРЬ -->

            <div
                class="door-card gold-card"
                data-message="Побольше счастливых случайностей."
            >


                <div class="door-scene">


                    <div class="door-frame">


                        <div class="door gold-door">


                            <div class="door-panel"></div>


                            <button
                                class="handle"
                                aria-label="Открыть дверь"
                            ></button>


                        </div>


                        <div class="light gold-light"></div>


                    </div>


                </div>


                <p class="door-hint">
                    потяни за ручку
                </p>


            </div>


        </section>



        <!-- ФРАЗА ПОСЛЕ ОТКРЫТИЯ -->

        <section
            class="result"
            id="result"
        >


            <p
                class="result-small"
                id="resultSmall"
            >
                За этой дверью...
            </p>


            <h2
                id="resultText"
            >
                Побольше хорошего.
            </h2>


            <p class="result-bottom">
                Хороший выбор.
            </p>


        </section>



        <!-- КНОПКА -->

        <a
            href="#"
            class="next-button"
            id="nextButton"
        >
            дальше
        </a>


    </main>



    <script src="page4.js"></script>


</body>

</html>
