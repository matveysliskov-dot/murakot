<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Выбери дверь</title>

    <link
        rel="stylesheet"
        href="page4.css"
    >

</head>


<body>


    <!-- ФОН -->

    <div class="background"></div>

    <div class="overlay"></div>


    <!-- ОСНОВНАЯ СТРАНИЦА -->

    <main class="page">


        <!-- ТЕКСТ -->

        <section class="intro">

            <p class="small-text">
                Небольшой выбор
            </p>


            <h1>
                Выбери дверь.
            </h1>


            <p class="subtitle">
                За одной из них тебя кое-что ждёт.
            </p>

        </section>



        <!-- ДВЕРИ -->

        <section class="doors">


            <!-- ДВЕРЬ 1 -->

            <div
                class="door-card"
                data-door="1"
            >

                <div class="door-scene">

                    <div class="door-frame">


                        <!-- КАРТИНКА -->

                        <div class="surprise">

                            <img
                                src="shava.jpg"
                                alt="Сюрприз"
                            >

                        </div>


                        <!-- ДВЕРЬ -->

                        <div class="door">


                            <div class="door-panel panel-top"></div>

                            <div class="door-panel panel-bottom"></div>


                            <!-- НОМЕР -->

                            <div class="door-number">

                                1

                            </div>


                            <!-- РУЧКА -->

                            <button
                                class="handle"
                                type="button"
                                aria-label="Открыть дверь 1"
                            ></button>


                        </div>


                    </div>

                </div>


                <p class="door-hint">
                    потяни за ручку
                </p>


            </div>



            <!-- ДВЕРЬ 2 -->

            <div
                class="door-card"
                data-door="2"
            >

                <div class="door-scene">

                    <div class="door-frame">


                        <!-- КАРТИНКА -->

                        <div class="surprise">

                            <img
                                src="shava.jpg"
                                alt="Сюрприз"
                            >

                        </div>


                        <!-- ДВЕРЬ -->

                        <div class="door">


                            <div class="door-panel panel-top"></div>

                            <div class="door-panel panel-bottom"></div>


                            <!-- НОМЕР -->

                            <div class="door-number">

                                2

                            </div>


                            <!-- РУЧКА -->

                            <button
                                class="handle"
                                type="button"
                                aria-label="Открыть дверь 2"
                            ></button>


                        </div>


                    </div>

                </div>


                <p class="door-hint">
                    потяни за ручку
                </p>


            </div>



            <!-- ДВЕРЬ 3 -->

            <div
                class="door-card"
                data-door="3"
            >

                <div class="door-scene">

                    <div class="door-frame">


                        <!-- КАРТИНКА -->

                        <div class="surprise">

                            <img
                                src="shava.jpg"
                                alt="Сюрприз"
                            >

                        </div>


                        <!-- ДВЕРЬ -->

                        <div class="door">


                            <div class="door-panel panel-top"></div>

                            <div class="door-panel panel-bottom"></div>


                            <!-- НОМЕР -->

                            <div class="door-number">

                                3

                            </div>


                            <!-- РУЧКА -->

                            <button
                                class="handle"
                                type="button"
                                aria-label="Открыть дверь 3"
                            ></button>


                        </div>


                    </div>

                </div>


                <p class="door-hint">
                    потяни за ручку
                </p>


            </div>


        </section>



        <!-- РЕЗУЛЬТАТ -->

        <section
            class="result"
            id="result"
        >

            <p>
                Поздравляю.
            </p>


            <h2>
                Ты выбрала правильную дверь.
            </h2>


        </section>



        <!-- КНОПКА -->

        <a
            href="#"
            class="next-button"
            id="nextButton"
        >

            дальше

        </a>


    </main>


    <script src="page4.js"></script>


</body>

</html>
