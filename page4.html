<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Небольшой выбор</title>

    <link
        rel="stylesheet"
        href="page4.css"
    >
</head>


<body>


    <!-- ФОН -->

    <div class="background"></div>

    <div class="dark-overlay"></div>


    <!-- ОСНОВНАЯ СТРАНИЦА -->

    <main class="page">


        <!-- ЗАГОЛОВОК -->

        <section class="intro">

            <p class="small-title">
                НЕБОЛЬШОЙ ВЫБОР
            </p>

            <h1>
                Выбери дверь.
            </h1>

            <p class="subtitle">
                За одной из них тебя кое-что ждёт.
            </p>

        </section>


        <!-- ДВЕРИ -->

        <section class="doors">


            <!-- ДВЕРЬ 1 -->

            <article
                class="door-card"
                data-door="1"
            >

                <div class="door-frame">

                    <div class="door">

                        <div class="door-panel panel-top"></div>

                        <div class="door-panel panel-bottom"></div>


                        <div class="door-number">
                            1
                        </div>


                        <button
                            class="handle"
                            type="button"
                            aria-label="Открыть дверь 1"
                        ></button>

                    </div>

                </div>


                <p class="door-hint">
                    ПОТЯНИ ЗА РУЧКУ
                </p>

            </article>


            <!-- ДВЕРЬ 2 -->

            <article
                class="door-card"
                data-door="2"
            >

                <div class="door-frame">

                    <div class="door">

                        <div class="door-panel panel-top"></div>

                        <div class="door-panel panel-bottom"></div>


                        <div class="door-number">
                            2
                        </div>


                        <button
                            class="handle"
                            type="button"
                            aria-label="Открыть дверь 2"
                        ></button>

                    </div>

                </div>


                <p class="door-hint">
                    ПОТЯНИ ЗА РУЧКУ
                </p>

            </article>


            <!-- ДВЕРЬ 3 -->

            <article
                class="door-card"
                data-door="3"
            >

                <div class="door-frame">

                    <div class="door">

                        <div class="door-panel panel-top"></div>

                        <div class="door-panel panel-bottom"></div>


                        <div class="door-number">
                            3
                        </div>


                        <button
                            class="handle"
                            type="button"
                            aria-label="Открыть дверь 3"
                        ></button>

                    </div>

                </div>


                <p class="door-hint">
                    ПОТЯНИ ЗА РУЧКУ
                </p>

            </article>


        </section>


        <!-- ТЕКСТ ПОСЛЕ ОТКРЫТИЯ -->

        <section
            class="result"
            id="result"
        >

            <p>
                Поздравляю.
            </p>

        </section>


    </main>


    <!--
        СЛОЙ С КАРТИНКОЙ

        ВАЖНО:
        Он находится НЕ внутри дверей.

        Поэтому всегда выше всех дверей.
    -->

    <div
        class="surprise-layer"
        id="surpriseLayer"
        aria-hidden="true"
    >

        <img
            src="shava.jpg"
            alt="Сюрприз"
            id="surpriseImage"
        >

    </div>


    <!-- ВСПЫШКА -->

    <div
        class="flash"
        id="flash"
    ></div>


    <script src="page4.js"></script>


</body>

</html>
